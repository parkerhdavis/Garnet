[package]
name = "garnet"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = ["protocol-asset"] }
tauri-plugin-fs = "^2.0.0"
tauri-plugin-dialog = "^2.0.0"
tauri-plugin-opener = "^2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "tga"] }
exr = "1.7"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
blake3 = "1.5"
kamadak-exif = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt", "net", "io-util"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
notify = "8"
notify-debouncer-mini = "0.6"
rayon = "1.10"
# Audio tag (ID3/Vorbis/MP4) reading for the base indexer's audio metadata.
# Pure Rust, MIT/Apache. Also pulls embedded cover art for the Music plugin.
lofty = "0.24"
# Native audio playback + waveform peaks for the Music Library plugin.
# Symphonia decodes; Rodio drives the OS sink via CPAL (needs libasound2 on
# Linux). Bypasses the webview's audio pipeline, which chops compressed audio
# on Linux. crossbeam carries commands from Tauri handlers to the audio thread.
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
crossbeam-channel = "0.5"

# Cross-platform user-extended-attribute mirror for garnet_metadata. The
# `xattr` crate supports Linux/macOS/FreeBSD; Windows uses NTFS alternate
# data streams via plain std::fs OpenOptions (see garnet_metadata::mirror).
[target.'cfg(unix)'.dependencies]
xattr = "1.3"

[dev-dependencies]
tempfile = "3"

# Image decode/encode/resize is painfully slow in an unoptimized debug build;
# bumping just the `image` crate to opt-level 3 keeps editor previews and batch
# automations responsive in `make dev` without optimizing the whole tree.
[profile.dev.package.image]
opt-level = 3

# Symphonia audio decode is just as slow unoptimized — a full-file decode (for
# waveform peaks on first play) takes several seconds in a debug build, which
# stalls playback. Bump the codec/format crates so the Music player stays
# responsive in `make dev`, scoped to the audio crates like `image` above.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
