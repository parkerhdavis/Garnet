[package]
name = "garnet"
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = ["protocol-asset"] }
tauri-plugin-fs = "^2.0.0"
tauri-plugin-dialog = "^2.0.0"
tauri-plugin-opener = "^2.0.0"
# Routes "Open with Garnet" / double-click into the already-running instance
# instead of launching a second copy; its callback hands us the new argv.
tauri-plugin-single-instance = "^2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "tga"] }
exr = "1.7"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
blake3 = "1.5"
kamadak-exif = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt", "net", "io-util"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
notify = "8"
notify-debouncer-mini = "0.6"
rayon = "1.10"
# Audio tag (ID3/Vorbis/MP4) reading for the base indexer's audio metadata.
# Pure Rust, MIT/Apache. Also pulls embedded cover art for the Music plugin.
lofty = "0.24"
# Native audio playback + waveform peaks for the Music Library plugin.
# Symphonia decodes; Rodio drives the OS sink via CPAL (needs libasound2 on
# Linux). Bypasses the webview's audio pipeline, which chops compressed audio
# on Linux. crossbeam carries commands from Tauri handlers to the audio thread.
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
crossbeam-channel = "0.5"

# Cross-platform user-extended-attribute mirror for garnet_metadata. The
# `xattr` crate supports Linux/macOS/FreeBSD; Windows uses NTFS alternate
# data streams via plain std::fs OpenOptions (see garnet_metadata::mirror).
[target.'cfg(unix)'.dependencies]
xattr = "1.3"

[dev-dependencies]
tempfile = "3"

# Image/audio decode/encode/resize and hashing are painfully slow in an
# unoptimized debug build — saving a single 30 MP JPEG in `make dev` took ~12s
# (≈7s decode + ≈4s encode) versus ~1.3s in release. The heavy work lives in
# dependency sub-crates (zune-jpeg + jpeg-encoder for JPEG, exr, symphonia
# codecs, blake3 for hashing, rayon, …), and per-crate opt-level entries kept
# missing the ones that mattered. So optimize *every* dependency in dev — but
# NOT our own crate, so incremental app rebuilds stay fast. The one-time cost is
# a slower first/clean build; everything after is cached. Keeps the editor,
# 3D Texturing, Music player, and Automations responsive in `make dev`.
[profile.dev.package."*"]
opt-level = 3

# Bump OUR crate to opt-level 1 too — the per-package bump above doesn't reach
# the code that actually dominates a save. The `image` crate's JPEG encode (and
# the f32→u8 conversions) are generic, so their hot loops monomorphize into the
# *call site* (this crate) and compile at this crate's opt-level, not `image`'s.
# At debug opt-0 a 30 MP JPEG encode took ~4s; opt-1 drops it to ~0.8s and the
# f32 editor/texturing pipelines from ~0.85s to ~0.3s — a ~12s save becomes
# ~1.5s, near release. opt-1 (not 2/3, and no LTO — that re-links the whole
# binary every change, ~50s) keeps incremental rebuilds tolerable.
[profile.dev]
opt-level = 1
